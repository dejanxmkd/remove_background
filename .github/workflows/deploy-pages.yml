name: Repair stuck GitHub Pages deployment (temporary)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  unblock-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages deployment using GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages-cancel-response -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/3d830f96a7a78b445221c362591c765bdb9015a8/cancel")
          echo "GitHub Pages cancel status: ${code}"
          cat /tmp/pages-cancel-response
          test "${code}" = "204"
