name: Install 50 scroll frames

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-50-scroll-frames.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and normalize 50 frames
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/scroll-frames-src scroll-frames
          mkdir -p /tmp/scroll-frames-src scroll-frames
          unzip -q frames_8k_total_under_25mb.zip -d /tmp/scroll-frames-src

          mapfile -t files < <(find /tmp/scroll-frames-src -type f | grep -Ei '\.(png|jpe?g|webp|avif)$' | sort -V)
          count="${#files[@]}"
          echo "Found $count image frames"
          if [ "$count" -ne 50 ]; then
            printf '%s\n' "${files[@]}"
            echo "Expected exactly 50 image frames, found $count" >&2
            exit 1
          fi

          i=1
          for src in "${files[@]}"; do
            ext="${src##*.}"
            ext="$(printf '%s' "$ext" | tr '[:upper:]' '[:lower:]')"
            case "$ext" in
              jpeg) ext="jpg" ;;
            esac
            dest="scroll-frames/frame_$(printf '%02d' "$i").$ext"
            cp "$src" "$dest"
            i=$((i+1))
          done

          rm -f frame_0{1..9}.png frame_10.png

          {
            echo 'window.SCROLL_FRAMES = ['
            find scroll-frames -maxdepth 1 -type f | sort -V | while read -r file; do
              printf '  "./%s",\n' "$file"
            done
            echo '];'
          } > scroll-frames.js

          echo "Normalized frames:"
          find scroll-frames -maxdepth 1 -type f | sort -V

      - name: Update scroll animation for 50-frame manifest
        shell: python
        run: |
          from pathlib import Path

          app_path = Path('app.js')
          app = app_path.read_text()
          old = "const frames=Array.from({length:10},(_,i)=>`./frame_${String(i+1).padStart(2,'0')}.png`);\nconst preloadedFrames=frames.map(src=>{\n  const img=new Image();\n  img.decoding='async';\n  img.src=src;\n  return img;\n});"
          new = "const frames=Array.isArray(window.SCROLL_FRAMES)?window.SCROLL_FRAMES:[];\n\n// Preload the sequence progressively so the first frames are ready immediately\n// without forcing all 50 8K images to decode at once.\nconst preloadedFrames=[];\nfunction preloadFrame(index){\n  if(index<0||index>=frames.length||preloadedFrames[index])return;\n  const img=new Image();\n  img.decoding='async';\n  img.src=frames[index];\n  preloadedFrames[index]=img;\n}\nfor(let i=0;i<Math.min(8,frames.length);i++)preloadFrame(i);\nconst preloadRemaining=()=>{\n  for(let i=8;i<frames.length;i++)preloadFrame(i);\n};\nif('requestIdleCallback' in window){\n  requestIdleCallback(preloadRemaining,{timeout:1800});\n}else{\n  setTimeout(preloadRemaining,500);\n}"
          if old not in app:
              raise SystemExit('Expected 10-frame block not found in app.js')
          app = app.replace(old, new)

          # Guard rendering if the manifest did not load for any reason.
          app = app.replace("function render(progress){\n  const sequenceOpacity", "function render(progress){\n  if(!frames.length)return;\n  const sequenceOpacity")

          # Keep nearby frames warm as the user moves through the sequence.
          app = app.replace("  const nextIndex=Math.min(frames.length-1,index+1);\n  const local=position-index;", "  const nextIndex=Math.min(frames.length-1,index+1);\n  for(let i=index-2;i<=nextIndex+3;i++)preloadFrame(i);\n  const local=position-index;")
          app_path.write_text(app)

          index_path = Path('index.html')
          html = index_path.read_text()
          if 'scroll-frames.js' not in html:
              marker = '<script src="app.js"></script>'
              if marker not in html:
                  raise SystemExit('app.js script tag not found in index.html')
              html = html.replace(marker, '<script src="scroll-frames.js"></script>\n  ' + marker)
              index_path.write_text(html)

      - name: Commit 50-frame scroll animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Implement 50-frame scroll animation"
            git push
          fi
