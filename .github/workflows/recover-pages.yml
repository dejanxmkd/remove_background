name: Recover stuck GitHub Pages deployment
on:
  push:
    paths:
      - '.github/workflows/recover-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  cancel-stuck-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel orphaned Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/dejanxmkd/remove_background/pages/deployments/cd5536e9c2769e60de0b60339a6db683aee561ed/cancel")
          echo "Cancel Pages deployment HTTP status: $status"
          if [ "$status" != "204" ]; then
            cat response.json
            exit 1
          fi
