<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6633CC">
  <title>Dashboard — True Distributors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=nav-nohover-v4">
<style>
/* Dashboard-only layout: original storefront components, right aligned. */
.site-nav{display:flex;align-items:center}
.shopping-nav-controls{margin-left:auto;justify-content:flex-end}
@media(max-width:760px){
  .site-nav{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;min-height:66px}
  .site-nav-logo{flex:none;width:auto}
  .shopping-nav-controls{display:flex;flex:1;min-width:0;width:auto;margin-left:auto;align-items:center;justify-content:flex-end;gap:clamp(7px,2vw,15px)}
  .shopping-user{display:flex;flex:none;min-width:0}
  .shopping-user-details{min-width:0}
  .mobile-user-trigger{max-width:150px}
  .mobile-user-trigger-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media(max-width:380px){
  .site-nav-logo img{width:108px}
  .shopping-nav-controls{gap:4px}
}
</style>
<style>
/* Dashboard-only solid purple block: exactly the Home hero minimum heights. */
.dashboard-purple-hero{width:100%;min-height:clamp(520px,68vw,740px);background:var(--purple,#6633CC)}
@media(max-width:760px){.dashboard-purple-hero{min-height:570px}}
</style>
<style>
/* Dashboard-only tracking; storefront colors, font and card geometry. */
.dashboard-hero-content{width:min(1440px,calc(100% - 96px));margin:0 auto;padding:64px 0 88px}
.dashboard-tracking-heading{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:30px;color:#fff}
.dashboard-tracking-heading h1{margin:0;font-size:clamp(26px,2.25vw,34px);font-weight:900;line-height:1.08;letter-spacing:-.035em}
.dashboard-order-meta{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:12px;margin:0;color:#fff;font-size:clamp(13px,1.15vw,16px);font-weight:500;line-height:1.5}
.dashboard-order-meta strong{font-weight:800}
.dashboard-tracking-card{width:100%;padding:38px 52px 34px;background:#fff;border:1px solid var(--line);border-radius:17px;color:var(--ink)}
.dashboard-tracking-steps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.dashboard-tracking-steps li{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;gap:14px;font-size:clamp(13px,1.15vw,16px);line-height:1.35;font-weight:700;text-align:center}
.dashboard-tracking-steps li:not(:last-child)::after{content:"";position:absolute;z-index:0;left:calc(50% + 20px);top:18px;width:calc(100% - 40px);height:3px;background:var(--line)}
.dashboard-tracking-steps li.is-complete:first-child::after{background:var(--purple)}
.dashboard-tracking-marker{width:39px;height:39px;border:2px solid #a7a0ae;border-radius:50%;flex:none;background:#fff;display:grid;place-items:center;position:relative;z-index:1;color:#fff}
.dashboard-tracking-steps .is-complete .dashboard-tracking-marker{background:var(--purple);border-color:var(--purple)}
@media(max-width:760px){
  .dashboard-hero-content{width:calc(100% - 36px);padding:40px 0 64px}
  .dashboard-tracking-heading{align-items:flex-start;flex-direction:column;gap:15px;margin-bottom:28px}
  .dashboard-tracking-heading h1{font-size:clamp(24px,6.4vw,30px)}
  .dashboard-order-meta{justify-content:flex-start;gap:8px;font-size:13px}
  .dashboard-tracking-card{padding:28px 16px 26px}
  .dashboard-tracking-steps li{gap:12px;font-size:clamp(10px,2.7vw,13px)}
  .dashboard-tracking-marker{width:31px;height:31px}
  .dashboard-tracking-marker svg{width:16px;height:16px}
  .dashboard-tracking-steps li:not(:last-child)::after{left:calc(50% + 16px);top:14px;width:calc(100% - 32px);height:2px}
}
</style>
</head>
<body data-auth-preview="true">
<header class="site-header" id="top">
  <nav class="site-nav" aria-label="Main navigation">
    <a href="./index.html" class="site-nav-logo" aria-label="True Distributors — back to top">
      <img src="./td_logo.svg" alt="True Distributors" width="128" height="27">
    </a>
    <div class="shopping-nav-controls">
      <button class="header-search-toggle" id="headerSearchToggle" type="button" aria-label="Open search" aria-expanded="false" aria-controls="headerSearchPanel">
        <svg xmlns="http://www.w3.org/2000/svg" class="lucide-icon lucide-search header-search-open-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><svg xmlns="http://www.w3.org/2000/svg" class="lucide-icon lucide-x header-search-close-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <span class="shopping-cart-button" role="img" aria-label="Notifications, 3 unread">
        <svg xmlns="http://www.w3.org/2000/svg" class="lucide-icon lucide-bell" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
        <span class="shopping-cart-count" aria-label="3 unread notifications">3</span>
      </span>
      <span class="shopping-nav-separator" aria-hidden="true"></span>
      <div class="shopping-user">
        <div class="shopping-user-details">
          <label for="shoppingUser" class="shopping-user-label">Shopping for</label>
          <div class="shopping-user-select">
            <select id="shoppingUser" aria-label="Switch shopping user">
              <option value="Fresh Market" selected>Fresh Market</option>
              <option value="City Grocers">City Grocers</option>
            </select>
            <svg xmlns="http://www.w3.org/2000/svg" class="lucide-icon lucide-chevron-down" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <button class="mobile-user-trigger" id="mobileUserTrigger" type="button" aria-label="Switch shopping account: Fresh Market" aria-haspopup="dialog" aria-controls="mobileUserSheet">
            <span class="mobile-user-trigger-copy">
              <span class="mobile-user-trigger-label">Shopping for</span>
              <strong class="mobile-user-trigger-name" id="mobileUserName">Fresh Market</strong>
            </span>
            <svg xmlns="http://www.w3.org/2000/svg" class="lucide-icon lucide-chevron-down" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </nav>
  <div class="header-search-panel" id="headerSearchPanel" role="search" aria-hidden="true" inert>
    <div class="header-search-reveal">
      <div class="header-search-inner">
        <svg xmlns="http://www.w3.org/2000/svg" class="lucide-icon lucide-search" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="headerSearchInput" type="search" aria-label="Search products" placeholder="Search products..." autocomplete="off" enterkeyhint="search">
        <button class="header-search-clear" id="headerSearchClear" type="button" aria-label="Clear search" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" class="lucide-icon lucide-x" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>
  </div>
</header>
<div class="mobile-user-sheet" id="mobileUserSheet" aria-hidden="true" inert>
  <button class="mobile-user-sheet-backdrop" id="mobileUserBackdrop" type="button" tabindex="-1" aria-label="Close shopping account selector"></button>
  <section class="mobile-user-sheet-dialog" role="dialog" aria-modal="true" aria-labelledby="mobileUserSheetTitle" tabindex="-1">
    <div class="mobile-user-sheet-grab" aria-hidden="true"></div>
    <div class="mobile-user-sheet-header"><div><h2 id="mobileUserSheetTitle">Select a store</h2></div></div>
    <div class="mobile-user-sheet-options" id="mobileUserOptions" role="group" aria-label="Available shopping accounts"></div>
  </section>
</div>
  <main id="dashboard" aria-label="Dashboard">
  <section class="dashboard-purple-hero" aria-labelledby="orderTrackingTitle">
    <div class="dashboard-hero-content">
      <div class="dashboard-tracking-heading">
        <h1 id="orderTrackingTitle">ORDER TRACKING</h1>
        <p class="dashboard-order-meta"><strong>Order #88432</strong><span aria-hidden="true">·</span><span>Estimated: Today, 2:00 PM</span></p>
      </div>
      <div class="dashboard-tracking-card" aria-label="Order #88432 tracking progress">
        <ol class="dashboard-tracking-steps">
          <li class="is-complete">
            <span class="dashboard-tracking-marker" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="lucide-icon lucide-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg></span>
            <span>Ordered</span>
          </li>
          <li class="is-complete">
            <span class="dashboard-tracking-marker" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="lucide-icon lucide-check" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg></span>
            <span>Processing</span>
          </li>
          <li class="is-pending"><span class="dashboard-tracking-marker" aria-hidden="true"></span><span>Out for Delivery</span></li>
          <li class="is-pending"><span class="dashboard-tracking-marker" aria-hidden="true"></span><span>Delivered</span></li>
        </ol>
      </div>
    </div>
  </section>
</main>
<script>
/* Dashboard header. Existing storefront UI styles, no Quick Shop or burger. */
(function(){
  'use strict';
  const $=selector=>document.querySelector(selector);
  const select=$('#shoppingUser'),storageKey='td-active-shopping-for-v1';
  const searchToggle=$('#headerSearchToggle'),searchPanel=$('#headerSearchPanel');
  const searchInput=$('#headerSearchInput'),searchClear=$('#headerSearchClear');
  const mobileMedia=window.matchMedia('(max-width:760px)');
  const mobileSheet=$('#mobileUserSheet'),mobileTrigger=$('#mobileUserTrigger'),mobileOptions=$('#mobileUserOptions');
  function updateMobileSearchTop(){
    if(!mobileMedia.matches)return;
    const nav=$('.site-nav');
    if(nav)document.documentElement.style.setProperty('--mobile-search-top',Math.max(0,Math.round(nav.getBoundingClientRect().bottom))+'px');
  }
  function setSearchOpen(open,restoreFocus=false){
    if(open&&mobileMedia.matches)updateMobileSearchTop();
    searchPanel.classList.toggle('is-open',open);
    searchPanel.inert=!open;
    searchPanel.setAttribute('aria-hidden',String(!open));
    searchToggle.setAttribute('aria-expanded',String(open));
    searchToggle.setAttribute('aria-label',open?'Close search':'Open search');
    if(open){if(!mobileMedia.matches)searchInput.focus({preventScroll:true});}
    else{
      if(searchPanel.contains(document.activeElement))document.activeElement.blur();
      if(restoreFocus)searchToggle.focus({preventScroll:true});
    }
  }
  window.addEventListener('resize',updateMobileSearchTop,{passive:true});
  window.addEventListener('scroll',updateMobileSearchTop,{passive:true});
  mobileMedia.addEventListener('change',updateMobileSearchTop);
  window.visualViewport?.addEventListener('resize',updateMobileSearchTop,{passive:true});
  updateMobileSearchTop();
  searchToggle.addEventListener('click',()=>setSearchOpen(!searchPanel.classList.contains('is-open')));
  searchPanel.addEventListener('click',e=>{
    if(!e.target.closest('button')&&e.target!==searchInput)searchInput.focus({preventScroll:true});
  });
  searchInput.addEventListener('input',()=>{searchClear.hidden=!searchInput.value.length;});
  searchInput.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();location.assign('./index.html#new-title');}
  });
  searchClear.addEventListener('click',()=>{searchInput.value='';searchClear.hidden=true;searchInput.focus();});
  document.addEventListener('pointerdown',e=>{
    if(searchPanel.classList.contains('is-open')&&!searchPanel.contains(e.target)&&!searchToggle.contains(e.target))setSearchOpen(false);
  });
  function syncAccount(){
    const label=select.selectedOptions[0]?.textContent||select.value;
    $('#mobileUserName').textContent=label;
    mobileTrigger.setAttribute('aria-label','Switch shopping account: '+label);
    try{localStorage.setItem(storageKey,select.value);}catch(e){}
  }
  try{
    const saved=localStorage.getItem(storageKey);
    if(saved&&Array.from(select.options).some(o=>o.value===saved))select.value=saved;
  }catch(e){}
  select.addEventListener('change',syncAccount);syncAccount();
  function closeSheet(){
    mobileSheet.classList.remove('is-open');mobileSheet.inert=true;
    mobileSheet.setAttribute('aria-hidden','true');document.body.classList.remove('mobile-user-sheet-active');
  }
  mobileTrigger.addEventListener('click',()=>{
    mobileOptions.replaceChildren();
    Array.from(select.options).forEach(option=>{
      const button=document.createElement('button');button.type='button';
      button.textContent=option.textContent;button.dataset.account=option.value;
      button.setAttribute('aria-pressed',String(option.value===select.value));mobileOptions.append(button);
    });
    mobileSheet.classList.add('is-open');mobileSheet.inert=false;
    mobileSheet.setAttribute('aria-hidden','false');document.body.classList.add('mobile-user-sheet-active');
  });
  mobileOptions.addEventListener('click',e=>{
    const btn=e.target.closest('[data-account]');if(!btn)return;
    select.value=btn.dataset.account;select.dispatchEvent(new Event('change',{bubbles:true}));closeSheet();
  });
  $('#mobileUserBackdrop').addEventListener('click',closeSheet);
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape')return;
    if(mobileSheet.classList.contains('is-open'))closeSheet();
    else if(searchPanel.classList.contains('is-open'))setSearchOpen(false,true);
  });
})();
</script>
</body>
</html>
