<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6633CC">
<title>Customer Dashboard — True Distributors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css?v=nav-nohover-v4">
<link rel="stylesheet" href="./dashboard.css?v=dashboard-nav-sketch-v9">
</head>
<body data-auth-preview="true">
<header class="site-header dashboard-header" id="top">
  <nav class="site-nav dashboard-nav" aria-label="Main navigation">
    <a class="site-nav-logo" href="./index.html" aria-label="True Distributors homepage"><img src="./td_logo.svg" alt="True Distributors" width="160" height="34"></a>
    <div class="dashboard-links" aria-label="Customer navigation">
      <a class="dashboard-link is-active" href="./dashboard.html" aria-current="page">Dashboard</a>
      <a class="dashboard-link" href="./index.html#new-title">Products</a>
      <a class="dashboard-link" href="./dashboard.html#orders">Orders</a>
      <a class="dashboard-link" href="./dashboard.html#invoices">Invoices</a>
      <a class="dashboard-link" href="./dashboard.html#support">Support</a>
    </div>
    <div class="dashboard-nav-actions">
      <form class="dashboard-search" id="dashboardSearch" role="search" action="./index.html">
        <input id="dashboardSearchInput" type="search" aria-label="Search products and SKUs" placeholder="Search products, SKUs..." autocomplete="off">
        <button class="dashboard-search-button" type="submit" aria-label="Search products"><svg class="lucide-icon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.2 16.2 4.2 4.2"/></svg></button>
      </form>
      <button class="dashboard-bell" id="dashboardNotifications" type="button" aria-label="Notifications" title="Notifications"><svg class="lucide-icon" viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="dashboard-notification-dot" aria-hidden="true"></span></button>
      <div class="dashboard-account">
        <button id="dashboardAccount" class="dashboard-account-button" type="button" aria-expanded="false" aria-controls="dashboardAccountMenu" aria-label="My Account">
          <span class="dashboard-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" width="23" height="23" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.3 3.4-7.3 8-7.3s8 3 8 7.3z"/></svg></span>
          <span class="dashboard-account-copy"><strong>My Account</strong><small id="dashboardAccountStore">Fresh Market</small></span>
          <svg class="dashboard-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="dashboardAccountMenu" class="dashboard-account-menu" hidden><span>Shopping for</span><button type="button" data-shop="Fresh Market">Fresh Market</button><button type="button" data-shop="City Grocers">City Grocers</button><a href="./index.html">Go to storefront</a></div>
      </div>
    </div>
  </nav>
</header>
<main>
<section class="dashboard-purple-hero" aria-label="Customer dashboard hero"></section>
</main>
<script src="./dashboard.js?v=dashboard-nav-sketch-v9"></script>
</body>
</html>
