<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#6633CC"><title>True Distributors — New Products</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet"></head>
<body><main class="page"><section class="new-section" aria-labelledby="new-title">
<div class="section-header"><div class="title-group"><div class="eyebrow">FRESH IN STOCK</div><h1 id="new-title">NEW ARRIVALS</h1></div><a class="view-all desktop-view-all" href="#all-products" id="viewAll">View All Products <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span></a></div>
<div class="carousel-wrap"><div class="carousel" id="productCarousel" tabindex="0" aria-label="New products slider"></div></div>
<div class="section-bottom"><div class="progress" role="progressbar" aria-label="Product carousel progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress"></span></div></div>
<a class="mobile-view-all" href="#all-products" id="mobileViewAll">View All Products <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span></a></section></main>
<section class="brands-section" aria-labelledby="brands-title">
 <div class="brands-shapes" aria-hidden="true"><span class="shape cyan tl"></span><span class="shape cyan tr"></span><span class="shape white ml"></span><span class="shape white mr"></span><span class="shape cyan bl"></span><span class="shape cyan br"></span><span class="shape purple-glow"></span></div>
 <div class="brands-inner">
  <div class="section-header"><div class="title-group"><div class="eyebrow brands-tag">EXPLORE OUR PARTNERS</div><h2 id="brands-title">BRANDS</h2></div></div>
  <div class="carousel-wrap"><div class="carousel brands-carousel" id="brandCarousel" tabindex="0" aria-label="Browse brands"></div></div>
  <div class="section-bottom"><div class="progress" role="progressbar" aria-label="Brand carousel progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="brandProgress"></span></div></div>
  
 </div>
</section>

<section class="categories-section" aria-labelledby="categories-title">
 <div class="categories-inner">
  <div class="section-header"><div class="title-group"><div class="eyebrow categories-tag">PRODUCTS WE OFFER</div><h2 id="categories-title">CATEGORIES</h2></div></div>
  <div class="carousel-wrap"><div class="carousel categories-carousel" id="categoryCarousel" tabindex="0" aria-label="Browse product categories"></div></div>
  <div class="section-bottom"><div class="progress" role="progressbar" aria-label="Category carousel progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="categoryProgress"></span></div></div>
 </div>
</section>
<div class="notification" id="notice" role="status" aria-live="polite"></div><script src="./app.js"></script></body></html>
