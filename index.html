<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#080706" />
  <title>Lumina</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="scroll-story" id="scroll-story">
    <div class="story-sticky">
      <section class="hero" data-light="off">
        <div class="hero-media" aria-hidden="true">
          <img class="hero-image hero-image--off" src="./assets/chandelier-off.png" alt="" />
          <img class="hero-image hero-image--on" src="./assets/chandelier-on.png" alt="" />
          <div class="hero-shade"></div>
          <div class="ambient-flicker"></div>
        </div>

        <header class="topbar">
          <a class="brand" href="#" aria-label="Home">LUMINA</a>
        </header>

        <section class="hero-copy">
          <h1>Shape the atmosphere.</h1>
        </section>

        <div class="light-control" aria-label="Chandelier light control">
          <span class="mode-label mode-label--dark">Dark</span>
          <button class="switch" id="light-switch" type="button" role="switch" aria-checked="false" aria-label="Turn chandelier light on">
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </button>
          <span class="mode-label mode-label--light">Light</span>
        </div>
      </section>

      <div class="sequence-layer" id="sequence-layer" aria-hidden="true">
        <img id="sequence-frame-a" class="sequence-frame sequence-frame--a" alt="" />
        <img id="sequence-frame-b" class="sequence-frame sequence-frame--b" alt="" />
        <div class="sequence-vignette"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
  <script src="./app.js"></script>
</body>
</html>
