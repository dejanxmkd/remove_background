<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6633CC">
  <title>Sign In or Create Account — True Distributors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./login.css?v=full-bleed-4">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-left" aria-label="Account access">
      <div class="auth-center">
        <div class="auth-box">
          <div class="auth-tabs" role="tablist" aria-label="Account options">
            <button id="loginTab" class="auth-tab is-active" type="button" role="tab" aria-controls="loginPanel" aria-selected="true" tabindex="0">Login</button>
            <button id="registerTab" class="auth-tab" type="button" role="tab" aria-controls="registerPanel" aria-selected="false" tabindex="-1">Create Account</button>
          </div>
          <section id="loginPanel" class="auth-panel" role="tabpanel" aria-labelledby="loginTab">
            <h1>Welcome back</h1>
            <form id="loginForm" class="auth-form">
              <div class="field">
                <label for="loginEmail">Email address</label>
                <input id="loginEmail" name="email" type="email" inputmode="email" autocomplete="username" placeholder="name@company.com" required>
              </div>
              <div class="field">
                <label for="loginPassword">Password</label>
                <div class="password-field">
                  <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
                  <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-password="loginPassword">
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.06 12.34a1 1 0 0 1 0-.68 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .68 10.75 10.75 0 0 1-19.88 0Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.88 5.09A10.7 10.7 0 0 1 12 4.88a10.75 10.75 0 0 1 9.94 6.78 1 1 0 0 1 0 .68 10.84 10.84 0 0 1-4.1 4.74"/><path d="M6.13 6.13a10.83 10.83 0 0 0-4.07 5.53 1 1 0 0 0 0 .68A10.75 10.75 0 0 0 12 19.12c1.02 0 2.01-.14 2.94-.4"/></svg>
                  </button>
                </div>
              </div>
              <button class="auth-primary" type="submit">Sign In</button>
              <p class="auth-status" id="loginStatus" role="status" aria-live="polite" hidden></p>
            </form>
          </section>
          <section id="registerPanel" class="auth-panel" role="tabpanel" aria-labelledby="registerTab" hidden>
            <h1>Create account</h1>
            <form id="registerForm" class="auth-form">
              <div class="field">
                <label for="registerName">Full name</label>
                <input id="registerName" name="name" type="text" autocomplete="name" placeholder="Your full name" required>
              </div>
              <div class="field">
                <label for="registerCompany">Company name</label>
                <input id="registerCompany" name="company" type="text" autocomplete="organization" placeholder="Company name" required>
              </div>
              <div class="field">
                <label for="registerEmail">Email address</label>
                <input id="registerEmail" name="email" type="email" inputmode="email" autocomplete="email" placeholder="name@company.com" required>
              </div>
              <div class="field">
                <label for="registerPassword">Password</label>
                <div class="password-field">
                  <input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
                  <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-password="registerPassword">
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.06 12.34a1 1 0 0 1 0-.68 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .68 10.75 10.75 0 0 1-19.88 0Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.88 5.09A10.7 10.7 0 0 1 12 4.88a10.75 10.75 0 0 1 9.94 6.78 1 1 0 0 1 0 .68 10.84 10.84 0 0 1-4.1 4.74"/><path d="M6.13 6.13a10.83 10.83 0 0 0-4.07 5.53 1 1 0 0 0 0 .68A10.75 10.75 0 0 0 12 19.12c1.02 0 2.01-.14 2.94-.4"/></svg>
                  </button>
                </div>
              </div>
              <div class="field">
                <label for="registerConfirm">Confirm password</label>
                <div class="password-field">
                  <input id="registerConfirm" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Confirm password" required>
                  <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-password="registerConfirm">
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.06 12.34a1 1 0 0 1 0-.68 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .68 10.75 10.75 0 0 1-19.88 0Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.88 5.09A10.7 10.7 0 0 1 12 4.88a10.75 10.75 0 0 1 9.94 6.78 1 1 0 0 1 0 .68 10.84 10.84 0 0 1-4.1 4.74"/><path d="M6.13 6.13a10.83 10.83 0 0 0-4.07 5.53 1 1 0 0 0 0 .68A10.75 10.75 0 0 0 12 19.12c1.02 0 2.01-.14 2.94-.4"/></svg>
                  </button>
                </div>
              </div>
              <button class="auth-primary" type="submit">Create Account</button>
              <p class="auth-status" id="registerStatus" role="status" aria-live="polite" hidden></p>
            </form>
          </section>
        </div>
      </div>
      <a class="back-home" href="./index.html">Back to Home</a>
    </section>
    <aside class="auth-right" aria-label="True Distributors">
      <span class="brand-circle brand-circle-left" aria-hidden="true"></span>
      <span class="brand-circle brand-circle-top" aria-hidden="true"></span>
      <span class="brand-circle brand-circle-middle-right" aria-hidden="true"></span>
      <span class="brand-circle brand-circle-bottom-left" aria-hidden="true"></span>
      <span class="brand-circle brand-circle-right" aria-hidden="true"></span>
      <span class="brand-circle brand-circle-soft" aria-hidden="true"></span>
      <img class="auth-brand-logo" src="./td_logo.svg" alt="True Distributors" width="128" height="27">
    </aside>
  </main>
  <script>
    const tabs=[document.getElementById('loginTab'),document.getElementById('registerTab')];
    const panels=[document.getElementById('loginPanel'),document.getElementById('registerPanel')];
    function selectTab(index,focus=false){
      tabs.forEach((tab,i)=>{
        const selected=i===index;
        tab.classList.toggle('is-active',selected);
        tab.setAttribute('aria-selected',String(selected));
        tab.tabIndex=selected?0:-1;
        panels[i].hidden=!selected;
      });
      if(focus)tabs[index].focus({preventScroll:true});
    }
    tabs.forEach((tab,index)=>{
      tab.addEventListener('click',()=>selectTab(index));
      tab.addEventListener('keydown',event=>{
        if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight'&&event.key!=='Home'&&event.key!=='End')return;
        event.preventDefault();
        const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:
          (index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
        selectTab(next,true);
      });
    });
    document.querySelectorAll('.password-toggle').forEach(button=>{
      button.addEventListener('click',()=>{
        const field=document.getElementById(button.dataset.password);
        const visible=field.type==='password';
        field.type=visible?'text':'password';
        button.setAttribute('aria-pressed',String(visible));
        button.setAttribute('aria-label',visible?'Hide password':'Show password');
      });
    });
    function showStatus(id,message){
      const status=document.getElementById(id);
      status.textContent=message;
      status.hidden=false;
    }
    document.getElementById('loginForm').addEventListener('submit',event=>{
      event.preventDefault();
      showStatus('loginStatus','Sign-in is a preview only. No credentials were sent.');
    });
    document.getElementById('registerForm').addEventListener('submit',event=>{
      event.preventDefault();
      const password=document.getElementById('registerPassword').value;
      const confirm=document.getElementById('registerConfirm').value;
      if(password!==confirm){
        showStatus('registerStatus','Passwords do not match.');
        document.getElementById('registerConfirm').focus();
        return;
      }
      showStatus('registerStatus','Registration is a preview only. No account was created or details sent.');
    });
  </script>
</body>
</html>
