<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6633CC">
  <title>Sign In — True Distributors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./login.css?v=purple-card-3">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <a class="site-logo" href="./index.html" aria-label="True Distributors home">
        <img src="./td_logo.svg" width="160" height="34" alt="True Distributors">
      </a>
      <a class="back-button" href="./index.html">
        <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        <span>Back to Home</span>
      </a>
    </nav>
  </header>
  <main class="login-main">
    <span class="login-background-circle" aria-hidden="true"></span>
    <section class="login-container" aria-labelledby="login-title">
      <h1 id="login-title">Sign In</h1>
      <form class="login-form" id="loginForm">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" name="email" type="email" inputmode="email" autocomplete="username" placeholder="Email address" required>
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="password-field">
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
            <button type="button" class="password-toggle" id="loginPasswordToggle" aria-label="Show password" aria-pressed="false">
              <svg class="lucide-icon icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.06 12.34a1 1 0 0 1 0-.68 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .68 10.75 10.75 0 0 1-19.88 0Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="lucide-icon icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.88 5.09A10.7 10.7 0 0 1 12 4.88a10.75 10.75 0 0 1 9.94 6.78 1 1 0 0 1 0 .68 10.84 10.84 0 0 1-4.1 4.74"/><path d="M6.13 6.13a10.83 10.83 0 0 0-4.07 5.53 1 1 0 0 0 0 .68A10.75 10.75 0 0 0 12 19.12c1.02 0 2.01-.14 2.94-.4"/></svg>
            </button>
          </div>
        </div>
        <button class="login-submit" type="submit">Sign In</button>
        <p class="login-status" id="loginStatus" role="status" aria-live="polite" hidden></p>
      </form>
    </section>
  </main>
  <script>
    const form=document.getElementById('loginForm');
    const input=document.getElementById('loginPassword');
    const toggle=document.getElementById('loginPasswordToggle');
    const status=document.getElementById('loginStatus');
    toggle.addEventListener('click',()=>{
      const visible=input.type==='password';
      input.type=visible?'text':'password';
      toggle.setAttribute('aria-pressed',String(visible));
      toggle.setAttribute('aria-label',visible?'Hide password':'Show password');
    });
    form.addEventListener('submit',event=>{
      event.preventDefault();
      status.textContent='Sign-in is not connected in this preview. No credentials were sent.';
      status.hidden=false;
    });
  </script>
</body>
</html>
