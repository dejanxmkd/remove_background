<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6633CC">
  <title>Login or Request an Account — True Distributors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./login.css?v=request-success-v1">
  <style>
    /* ===== Unified page-transition — same tokens as the storefront ===== */
    :root{--td-ease:cubic-bezier(.22,1,.36,1);--td-mid:.34s;--td-slow:.42s}
    body{opacity:1;transform:none;transition:opacity var(--td-slow) var(--td-ease),transform var(--td-slow) var(--td-ease)}
    body.td-pt-entering{opacity:0;transform:translateY(8px)}
    body.td-pt-leaving{opacity:0;transform:translateY(-8px);transition:opacity var(--td-mid) var(--td-ease),transform var(--td-mid) var(--td-ease)}
    @media(prefers-reduced-motion:reduce){
      body,body.td-pt-entering,body.td-pt-leaving{opacity:1!important;transform:none!important;transition:none!important}
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-left" aria-label="Account access">
      <div class="auth-center">
        <div class="auth-box">
          <div class="auth-tabs" role="tablist" aria-label="Account options">
            <button id="loginTab" class="auth-tab is-active" type="button" role="tab" aria-controls="loginPanel" aria-selected="true" tabindex="0">Login</button>
            <button id="registerTab" class="auth-tab" type="button" role="tab" aria-controls="registerPanel" aria-selected="false" tabindex="-1">Request an Account</button>
          </div>
          <section id="loginPanel" class="auth-panel" role="tabpanel" aria-labelledby="loginTab">
            <h1>Welcome back</h1>
            <form id="loginForm" class="auth-form">
              <div class="field">
                <label for="loginEmail">Email address</label>
                <input id="loginEmail" name="email" type="email" inputmode="email" autocomplete="username" placeholder="name@company.com" required>
              </div>
              <div class="field">
                <label for="loginPassword">Password</label>
                <div class="password-field">
                  <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
                  <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-password="loginPassword">
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.06 12.34a1 1 0 0 1 0-.68 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .68 10.75 10.75 0 0 1-19.88 0Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.88 5.09A10.7 10.7 0 0 1 12 4.88a10.75 10.75 0 0 1 9.94 6.78 1 1 0 0 1 0 .68 10.84 10.84 0 0 1-4.1 4.74"/><path d="M6.13 6.13a10.83 10.83 0 0 0-4.07 5.53 1 1 0 0 0 0 .68A10.75 10.75 0 0 0 12 19.12c1.02 0 2.01-.14 2.94-.4"/></svg>
                  </button>
                </div>
              </div>
              <button class="auth-primary" type="submit">Sign In</button>
              <p class="auth-status" id="loginStatus" role="status" aria-live="polite" hidden></p>
            </form>
          </section>
          <section id="registerPanel" class="auth-panel" role="tabpanel" aria-labelledby="registerTab" hidden>
            <h1>Basic Company Registration</h1>
            <form id="registerForm" class="auth-form">
              <div class="field"><label for="registerFirstName">First Name *</label><input id="registerFirstName" name="firstName" type="text" autocomplete="given-name" required></div>
              <div class="field"><label for="registerLastName">Last Name *</label><input id="registerLastName" name="lastName" type="text" autocomplete="family-name" required></div>
              <div class="field"><label for="registerEmail">Email Address *</label><input id="registerEmail" name="email" type="email" autocomplete="email" required></div>
              <div class="field"><label for="registerPhone">Phone Number *</label><input id="registerPhone" name="phone" type="tel" autocomplete="tel" required></div>
              <div class="field"><label for="registerCompany">Company Name *</label><input id="registerCompany" name="company" type="text" autocomplete="organization" required></div>
              <div class="field"><label for="registerAddress">Company Address *</label><input id="registerAddress" name="address" type="text" autocomplete="street-address" required></div>
              <div class="field"><label for="registerCity">City *</label><input id="registerCity" name="city" type="text" autocomplete="address-level2" required></div>
              <div class="field"><label for="registerPostal">ZIP / Postal Code *</label><input id="registerPostal" name="postalCode" type="text" autocomplete="postal-code" required></div>
              <button class="auth-primary" type="submit">Submit Request</button>
            </form>
            <div class="auth-request-success" id="registerSuccess" role="status" aria-live="polite" hidden>
              <h2>Your request has been submitted successfully.</h2>
              <p>Our team will review your information and get back to you soon.</p>
            </div>
          </section>
        </div>
      </div>
      <a class="back-home" href="./index.html">Back to Home</a>
    </section>
    <aside class="auth-right" aria-label="True Distributors">
      <span class="brand-circle brand-circle-left" aria-hidden="true"></span>
      <span class="brand-circle brand-circle-top" aria-hidden="true"></span>
      <span class="brand-circle brand-circle-middle-right" aria-hidden="true"></span>
      <span class="brand-circle brand-circle-bottom-left" aria-hidden="true"></span>
      <span class="brand-circle brand-circle-right" aria-hidden="true"></span>
      <img class="auth-brand-logo" src="./td_logo.svg" alt="True Distributors" width="128" height="27">
    </aside>
  </main>
  <script>
    const tabs=[document.getElementById('loginTab'),document.getElementById('registerTab')];
    const panels=[document.getElementById('loginPanel'),document.getElementById('registerPanel')];
    function selectTab(index,focus=false){
      tabs.forEach((tab,i)=>{
        const selected=i===index;
        tab.classList.toggle('is-active',selected);
        tab.setAttribute('aria-selected',String(selected));
        tab.tabIndex=selected?0:-1;
        panels[i].hidden=!selected;
      });
      if(focus)tabs[index].focus({preventScroll:true});
    }
    tabs.forEach((tab,index)=>{
      tab.addEventListener('click',()=>selectTab(index));
      tab.addEventListener('keydown',event=>{
        if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight'&&event.key!=='Home'&&event.key!=='End')return;
        event.preventDefault();
        const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:
          (index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
        selectTab(next,true);
      });
    });
    document.querySelectorAll('.password-toggle').forEach(button=>{
      button.addEventListener('click',()=>{
        const field=document.getElementById(button.dataset.password);
        const visible=field.type==='password';
        field.type=visible?'text':'password';
        button.setAttribute('aria-pressed',String(visible));
        button.setAttribute('aria-label',visible?'Hide password':'Show password');
      });
    });
    function showStatus(id,message){
      const status=document.getElementById(id);
      status.textContent=message;
      status.hidden=false;
    }
    document.getElementById('loginForm').addEventListener('submit',event=>{
      event.preventDefault();
      // Demo mode only: this site has no authentication backend.
      // Never retain or transmit entered email and password.
      showStatus('loginStatus','Demo preview enabled. No credentials were sent or verified. Opening the homepage...');
      try{sessionStorage.setItem('td-preview-auth-v1','true')}catch{}
      window.setTimeout(()=>window.location.assign('./index.html'),500);
    });
    document.getElementById('registerForm').addEventListener('submit',event=>{
      event.preventDefault();
      document.getElementById('registerForm').hidden=true;
      document.querySelector('#registerPanel > h1').hidden=true;
      document.getElementById('registerSuccess').hidden=false;
    });

    /* ===== Unified page transitions ===== */
    (function(){
      document.body.classList.add('td-pt-entering');
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ document.body.classList.remove('td-pt-entering'); });
      });
      setTimeout(function(){ document.body.classList.remove('td-pt-entering'); }, 600);
      window.addEventListener('pageshow', function(e){
        document.body.classList.remove('td-pt-leaving','td-pt-entering');
        if(e.persisted){
          document.body.classList.add('td-pt-entering');
          requestAnimationFrame(function(){
            requestAnimationFrame(function(){ document.body.classList.remove('td-pt-entering'); });
          });
        }
      });
      document.addEventListener('click', function(e){
        var a = e.target.closest ? e.target.closest('a[href]') : null;
        if(!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
        if(a.target === '_blank' || a.hasAttribute('download')) return;
        var href = a.getAttribute('href') || '';
        if(!href || href.charAt(0) === '#' || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0) return;
        try { if(new URL(a.href, location.href).origin !== location.origin) return; } catch(_) { return; }
        e.preventDefault();
        document.body.classList.add('td-pt-leaving');
        setTimeout(function(){ window.location.href = a.href; }, 260);
      }, true);
      /* Smooth fade-out on successful demo login */
      var lf = document.getElementById('loginForm');
      if(lf) lf.addEventListener('submit', function(){
        document.body.classList.add('td-pt-leaving');
      }, true);
    })();
  </script>
</body>
</html>
